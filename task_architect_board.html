<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Architect - Kanban Board</title>
    <style>
        :root {
            --bg-color: #0d1117;
            --text-color: #c9d1d9;
            --card-bg: #161b22;
            --column-bg: #010409;
            --accent-color: #58a6ff;
            --border-color: #30363d;
            --todo-color: #8b949e;
            --doing-color: #d29922;
            --done-color: #238636;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .header h1 { margin: 0; color: var(--accent-color); }
        .project-goal { font-size: 0.9rem; color: #8b949e; margin-top: 5px; }

        .board {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding-bottom: 20px;
        }
        .column {
            background-color: var(--column-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            min-width: 300px;
            max-width: 300px;
            display: flex;
            flex-direction: column;
        }
        .column-header {
            padding: 15px;
            font-weight: bold;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .count-badge {
            background: #30363d;
            padding: 2px 8px;
            border-radius: 10px;
            font-size: 0.8rem;
        }
        .task-list {
            padding: 10px;
            flex-grow: 1;
        }
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 15px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: transform 0.1s;
        }
        .card:hover { transform: translateY(-2px); border-color: var(--accent-color); }
        .card-title { font-weight: bold; margin-bottom: 5px; font-size: 0.95rem; }
        .card-desc { font-size: 0.85rem; color: #8b949e; line-height: 1.4; }
        
        .card-meta {
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 0.75rem;
        }
        .priority-high { color: #da3633; }
        .priority-medium { color: #d29922; }
        .priority-low { color: #8b949e; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Task Architect</h1>
        <div id="project-goal" class="project-goal"></div>
    </div>

    <div class="board" id="board">
        <!-- Columns will be injected here -->
    </div>

    <script>
        // DATA_START
        const projectData = {
    "goal": "ALPR System v3.0 Web Dashboard",
    "timestamp": "2026-08-09T13:17:36.816081",
    "tasks": [
        {
            "id": 1,
            "title": "Design Database Schema for Auth",
            "desc": "Create a users table in SQLite database and populate initial seed users with bcrypt-hashed passwords.",
            "status": "Todo",
            "priority": "High"
        },
        {
            "id": 2,
            "title": "Build Web API Server (Flask)",
            "desc": "Replace the minimal health check server with a Flask web application that serves dashboard routes, authentication, database query API, and image assets.",
            "status": "Todo",
            "priority": "High"
        },
        {
            "id": 3,
            "title": "Implement User Authentication & RBAC",
            "desc": "Add session-based or token-based (JWT) authentication, login route, session checks, and role-based access control (admin vs. viewer permissions).",
            "status": "Todo",
            "priority": "High"
        },
        {
            "id": 4,
            "title": "Implement Image Thumbnail Generator",
            "desc": "Create a helper to serve/resize thumbnails of vehicles from downloaded JPG images to optimize dashboard list views.",
            "status": "Todo",
            "priority": "Medium"
        },
        {
            "id": 5,
            "title": "Build Dashboard Frontend UI",
            "desc": "Develop a modern web interface with a secure login screen, a customizable sightings table (column selector), and an image modal that displays full-size vehicle snapshots.",
            "status": "Todo",
            "priority": "High"
        },
        {
            "id": 6,
            "title": "Update Docker & Process Management",
            "desc": "Add Flask dependencies to requirements.txt, ensure ports are exposed correctly, and configure main.py to spawn the Flask app on the Railway PORT.",
            "status": "Todo",
            "priority": "Medium"
        },
        {
            "id": 7,
            "title": "Integration Testing",
            "desc": "Write test cases for authentication endpoints, database queries, and role validation, verifying everything runs correctly locally.",
            "status": "Todo",
            "priority": "High"
        }
    ]
};
        // DATA_END

        function initBoard() {
            document.getElementById('project-goal').textContent = `Goal: ${projectData.goal}`;
            const board = document.getElementById('board');
            const statuses = ["Todo", "Doing", "Done"];
            
            statuses.forEach(status => {
                const colTasks = projectData.tasks.filter(t => t.status === status);
                const col = document.createElement('div');
                col.className = 'column';
                col.innerHTML = `
                    <div class="column-header">
                        ${status} <span class="count-badge">${colTasks.length}</span>
                    </div>
                    <div class="task-list">
                        ${colTasks.map(t => `
                            <div class="card">
                                <div class="card-title">${t.title}</div>
                                <div class="card-desc">${t.desc}</div>
                                <div class="card-meta">
                                    <span class="priority-${t.priority.toLowerCase()}">● ${t.priority}</span>
                                    <span>#${t.id}</span>
                                </div>
                            </div>
                        `).join('')}
                    </div>
                `;
                board.appendChild(col);
            });
        }

        initBoard();
    </script>
</body>
</html>
